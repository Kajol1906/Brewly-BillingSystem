spring.application.name=Brewly

# Import secrets from .env.properties (gitignored)
spring.config.import=optional:file:.env.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brewly_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable data.sql on every restart (tables are seeded via API)
spring.sql.init.mode=never

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:brewly_secret_key_123456}
jwt.expiration=86400000
spring.jpa.properties.hibernate.format_sql=false

# Google OAuth (loaded from env vars or .env.properties)
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Contact form
contact.recipient.email=${CONTACT_EMAIL:}

# Contact form email delivery
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

